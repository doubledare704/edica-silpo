[project]
name = "edica-silpo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.1",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "silpo-py-mcp>=0.1.2",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
